<!doctype html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Life Calendar</title>
<meta name="description" content="Un calendrier de vie de 90 années, semaine par semaine.">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%27http://www.w3.org/2000/svg%27 viewBox=%270 0 32 32%27%3E%3Crect width=%2732%27 height=%2732%27 rx=%277%27 fill=%27%23635bcb%27/%3E%3Ctext x=%276%27 y=%2725%27 font-size=%2727%27 fill=%27white%27%3E%E2%96%A6%3C/text%3E%3C/svg%3E">
<link rel="stylesheet" href="./life-calendar.css">
<script src="./life-calendar.js" defer></script>
</head>
<body>
<div id="life-minimal">
  <header><span class="brand">Life Calendar<span class="brand-dot"></span></span><div class="tools">
    <button type="button" data-tool="erase" aria-label="Gomme" title="Gomme"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="m16 3 5 5-11 11H5l-3-3L15 3Z M8 10l7 7 M10 21h12"/></svg></button>
    <button type="button" data-tool="undo" aria-label="Annuler" title="Annuler"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9 4 4 9l5 5 M4 9h10a6 6 0 0 1 0 12h-3"/></svg></button>
    <button type="button" data-tool="manage" aria-label="Gérer les catégories" title="Gérer les catégories"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 7h16 M4 17h16 M8 4v6 M16 14v6"/></svg></button>
  </div></header>
  <nav aria-label="Catégories"></nav>
  <main class="calendar"><div class="axis"><span></span><div></div></div><div class="grid" aria-label="Calendrier de vie"></div></main>
  <dialog aria-labelledby="category-title">
    <form method="dialog" class="dialog-header"><h1 id="category-title">Catégories</h1><button aria-label="Fermer" title="Fermer"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="m6 6 12 12 M18 6 6 18"/></svg></button></form>
    <div class="category-editor"></div>
    <form class="category-add"><input name="name" aria-label="Nom de la nouvelle catégorie" placeholder="Nouvelle catégorie" maxlength="60" required><input name="color" type="color" aria-label="Couleur de la nouvelle catégorie" value="#839775"><button type="submit">Ajouter</button></form>
  </dialog>
  <p class="save-error" role="alert" hidden>La sauvegarde locale est indisponible.</p>
</div>

</body>
</html>
